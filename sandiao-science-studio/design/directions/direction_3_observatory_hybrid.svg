<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .stroke-bold { stroke: #13223A; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-medium { stroke: #13223A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-fine { stroke: #13223A; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .telemetry-line { stroke: #1FD6E2; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .orbit-line { stroke: #1F5CFF; stroke-width: 2; stroke-linecap: round; }
      .font-display { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif; font-weight: 800; }
      .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif; font-weight: 600; }
      .font-mono { font-family: 'SF Mono', 'Roboto Mono', 'Menlo', monospace; font-weight: 600; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080E18"/>
      <stop offset="50%" stop-color="#101C31"/>
      <stop offset="100%" stop-color="#14233C"/>
    </linearGradient>

    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F6F9"/>
    </linearGradient>

    <filter id="panelShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#1FD6E2" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Observatory Night Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Telemetry Grid & Orbit Rings -->
  <g opacity="0.18">
    <line x1="0" y1="100" x2="1920" y2="100" stroke="#1FD6E2" stroke-width="1"/>
    <line x1="0" y1="920" x2="1920" y2="920" stroke="#1FD6E2" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="1080" stroke="#1FD6E2" stroke-width="1"/>
    <line x1="1840" y1="0" x2="1840" y2="1080" stroke="#1FD6E2" stroke-width="1"/>

    <!-- Crosshairs -->
    <circle cx="80" cy="100" r="14" fill="none" stroke="#1FD6E2" stroke-width="1"/>
    <circle cx="1840" cy="100" r="14" fill="none" stroke="#1FD6E2" stroke-width="1"/>
    <circle cx="80" cy="920" r="14" fill="none" stroke="#1FD6E2" stroke-width="1"/>
    <circle cx="1840" cy="920" r="14" fill="none" stroke="#1FD6E2" stroke-width="1"/>

    <!-- Orbit Rings in Background -->
    <ellipse cx="960" cy="200" rx="750" ry="280" fill="none" stroke="#1F5CFF" stroke-width="1.5" transform="rotate(-8 960 200)"/>
  </g>

  <!-- Top Brand Navigation Bar -->
  <g transform="translate(80, 36)">
    <!-- Asteroid Orbit Icon -->
    <g transform="translate(0, 0)">
      <circle cx="24" cy="24" r="16" fill="#1F5CFF"/>
      <ellipse cx="24" cy="24" rx="28" ry="10" fill="none" stroke="#1FD6E2" stroke-width="3" transform="rotate(-25 24 24)" filter="url(#cyanGlow)"/>
      <circle cx="44" cy="16" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Channel Name & Telemetry Meta -->
    <text x="70" y="32" fill="#FFFFFF" class="font-display" font-size="24" letter-spacing="1">小行星原理剧场</text>
    <rect x="245" y="10" width="80" height="28" rx="6" fill="#1F5CFF"/>
    <text x="285" y="29" fill="#FFFFFF" class="font-mono" font-size="14" text-anchor="middle">EP.01</text>

    <!-- Sub-tag -->
    <text x="345" y="30" fill="#8FA6CB" class="font-sans" font-size="16">| 观察课题：空调制冷与定频压缩机工况分析</text>

    <!-- Right Live Status -->
    <g transform="translate(1560, 10)">
      <circle cx="0" cy="14" r="5" fill="#1FD6E2" filter="url(#cyanGlow)"/>
      <text x="16" y="20" fill="#1FD6E2" class="font-mono" font-size="15">OBSERVATORY LIVE</text>
    </g>
  </g>

  <!-- Central High-Contrast Engineering Stage Card (x=380, w=1160) -->
  <g transform="translate(380, 120)" filter="url(#panelShadow)">
    <!-- Main Paper Board -->
    <rect x="0" y="0" width="1160" height="690" rx="24" fill="url(#stageGrad)" stroke="#13223A" stroke-width="3.5"/>

    <!-- Card Top Header Tab -->
    <g transform="translate(36, -20)">
      <rect x="0" y="0" width="460" height="42" rx="10" fill="#101C31" stroke="#1FD6E2" stroke-width="2"/>
      <circle cx="20" cy="21" r="5" fill="#F04B2F"/>
      <text x="36" y="28" fill="#FFFFFF" class="font-display" font-size="18">核心疑点：16℃ 会让制冷功率加倍吗？</text>
    </g>

    <!-- Diagram Layout: Two Balanced Columns -->
    <!-- Left Column: Misconception (Faucet Analogy) -->
    <g transform="translate(36, 50)">
      <rect x="0" y="0" width="510" height="580" rx="16" fill="#FFF5F5" stroke="#FFA39E" stroke-width="2"/>

      <!-- Column Header -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="100" height="28" rx="6" fill="#F04B2F"/>
        <text x="50" y="19" fill="#FFFFFF" class="font-display" font-size="14" text-anchor="middle">直觉误区</text>
        <text x="115" y="22" fill="#820014" class="font-display" font-size="20">水龙头旋钮模型（错）</text>
      </g>

      <!-- Faucet Visual Diagram -->
      <g transform="translate(130, 100)">
        <!-- Pipe -->
        <path d="M 0,50 L 140,50 A 24,24 0 0,1 164,74 L 164,140" fill="none" stroke="#8C8C8C" stroke-width="24" stroke-linecap="round"/>
        <path d="M 0,50 L 140,50 A 24,24 0 0,1 164,74 L 164,140" fill="none" class="stroke-medium"/>
        <!-- Valve knob -->
        <rect x="60" y="16" width="36" height="36" rx="6" fill="#F04B2F" class="stroke-medium"/>
        <text x="78" y="40" fill="#FFFFFF" class="font-display" font-size="16" text-anchor="middle">16℃</text>
        <!-- Gushing Cold Stream -->
        <path d="M 152,155 L 176,155 L 210,280 L 118,280 Z" fill="#91CAFF" opacity="0.65"/>
        <text x="164" y="240" fill="#003A8C" class="font-display" font-size="17" text-anchor="middle">误以为冷量暴增</text>
      </g>

      <!-- Rejection Stamp -->
      <g transform="translate(360, 210) rotate(-15)">
        <rect x="-65" y="-24" width="130" height="48" rx="10" fill="#FFF1F0" stroke="#F04B2F" stroke-width="3"/>
        <text x="0" y="8" fill="#F04B2F" class="font-display" font-size="22" text-anchor="middle">完全不符</text>
      </g>

      <!-- Bottom Explanation Banner -->
      <g transform="translate(20, 475)">
        <rect x="0" y="0" width="470" height="80" rx="10" fill="#FFFFFF" stroke="#FFCCC7" stroke-width="1.5"/>
        <text x="18" y="32" fill="#A8071A" class="font-sans" font-size="15">❌ 设定温度只是“目标停机线”，</text>
        <text x="18" y="58" fill="#A8071A" class="font-sans" font-size="15">❌ 绝非控制冷量喷射大小的物理阀门！</text>
      </g>
    </g>

    <!-- Right Column: Scientific Reality (Compressor Fixed Output) -->
    <g transform="translate(576, 50)">
      <rect x="0" y="0" width="548" height="580" rx="16" fill="#E6F9FB" stroke="#87E8DE" stroke-width="2"/>

      <!-- Column Header -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="100" height="28" rx="6" fill="#13C2C2"/>
        <text x="50" y="19" fill="#FFFFFF" class="font-display" font-size="14" text-anchor="middle">实际机制</text>
        <text x="115" y="22" fill="#00474F" class="font-display" font-size="20">定频压缩机额定工况</text>
      </g>

      <!-- Technical Compressor & Loop Visual -->
      <g transform="translate(60, 90)">
        <!-- AC Compressor Box -->
        <rect x="20" y="30" width="150" height="180" rx="24" fill="#101C31" class="stroke-bold"/>
        <rect x="38" y="55" width="114" height="80" rx="10" fill="#1F385C"/>
        <!-- Piston / Motor Animation symbol -->
        <circle cx="95" cy="95" r="28" fill="#1FD6E2" opacity="0.2"/>
        <circle cx="95" cy="95" r="16" fill="#1FD6E2" class="stroke-medium"/>
        <text x="95" y="165" fill="#1FD6E2" class="font-mono" font-size="16" text-anchor="middle">100% 额定功率</text>
        <text x="95" y="188" fill="#FFFFFF" class="font-sans" font-size="13" text-anchor="middle">恒定转速输出</text>

        <!-- Right Flow Arrow -->
        <path d="M 190,120 L 275,120" fill="none" stroke="#13C2C2" stroke-width="6" stroke-linecap="round"/>
        <polygon points="275,112 295,120 275,128" fill="#13C2C2"/>

        <!-- Heat Exchanger Evaporator Coils -->
        <g transform="translate(305, 30)">
          <rect x="0" y="0" width="85" height="180" rx="14" fill="#FFFFFF" class="stroke-medium"/>
          <!-- S-Coils -->
          <path d="M 20,25 Q 65,25 65,50 Q 65,75 20,75 Q 65,75 65,100 Q 65,125 20,125 Q 65,125 65,150" fill="none" stroke="#1890FF" stroke-width="5" stroke-linecap="round"/>
          <text x="42" y="202" fill="#003A8C" class="font-sans" font-size="13" text-anchor="middle">蒸发器换热</text>
        </g>
      </g>

      <!-- Verified Badge -->
      <g transform="translate(440, 210) rotate(8)">
        <rect x="-55" y="-22" width="110" height="44" rx="8" fill="#E6FFFB" stroke="#13C2C2" stroke-width="2.5"/>
        <text x="0" y="7" fill="#006D75" class="font-display" font-size="18" text-anchor="middle">✓ 物理事实</text>
      </g>

      <!-- Bottom Scientific Conclusion Banner -->
      <g transform="translate(20, 475)">
        <rect x="0" y="0" width="508" height="80" rx="10" fill="#FFFFFF" stroke="#B5F5EC" stroke-width="1.5"/>
        <text x="18" y="32" fill="#00474F" class="font-sans" font-size="15">✔ 压缩机启动即以额定能力运转；</text>
        <text x="18" y="58" fill="#00474F" class="font-sans" font-size="15">✔ 设 16℃ 绝无超级功率，只会让压缩机一直硬跑！</text>
      </g>
    </g>
  </g>

  <!-- Left Character: Lao Wang (x=50, w=300) -->
  <g id="char-laowang" transform="translate(40, 310)">
    <!-- Shadow on floor -->
    <ellipse cx="160" cy="530" rx="110" ry="18" fill="#050A14" opacity="0.6"/>

    <!-- Legs -->
    <path d="M 110,440 L 110,530 L 70,530" fill="none" stroke="#1A283F" stroke-width="32" stroke-linecap="round"/>
    <path d="M 210,440 L 210,530 L 250,530" fill="none" stroke="#1A283F" stroke-width="32" stroke-linecap="round"/>
    <!-- Shoes -->
    <rect x="60" y="515" width="60" height="22" rx="6" fill="#D4380D" class="stroke-medium"/>
    <rect x="200" y="515" width="60" height="22" rx="6" fill="#D4380D" class="stroke-medium"/>

    <!-- Torso: Work Vest & Polo -->
    <path d="M 80,240 C 60,300 70,450 100,450 L 220,450 C 250,450 260,300 240,240 Z" fill="#FA541C" class="stroke-bold"/>
    <path d="M 120,240 L 160,310 L 200,240 Z" fill="#FFE7BA"/>
    <!-- Tool Belt with Tape Measure -->
    <rect x="80" y="405" width="160" height="24" rx="5" fill="#13223A"/>
    <rect x="185" y="398" width="35" height="36" rx="6" fill="#FADB14" class="stroke-medium"/>

    <!-- Left Arm (Hand on Hip) -->
    <path d="M 80,265 C 30,300 20,370 75,390" fill="none" stroke="#FA541C" stroke-width="32" stroke-linecap="round"/>
    <path d="M 80,265 C 30,300 20,370 75,390" fill="none" class="stroke-bold"/>
    <circle cx="75" cy="390" r="16" fill="#F8D5B8" class="stroke-medium"/>

    <!-- Right Arm (Gesturing towards Stage) -->
    <path d="M 235,265 C 290,260 320,220 345,180" fill="none" stroke="#FA541C" stroke-width="32" stroke-linecap="round"/>
    <path d="M 235,265 C 290,260 320,220 345,180" fill="none" class="stroke-bold"/>
    <!-- Expressive Hand -->
    <g transform="translate(345, 180) rotate(-20)">
      <ellipse cx="0" cy="0" rx="16" ry="20" fill="#F8D5B8" class="stroke-medium"/>
      <path d="M -6,-16 L 8,-28 M 3,-16 L 18,-24 M 10,-12 L 22,-14" stroke="#13223A" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Head & Face Structure -->
    <g transform="translate(160, 150)">
      <!-- Neck -->
      <rect x="-20" y="55" width="40" height="40" rx="6" fill="#F8D5B8" class="stroke-medium"/>

      <!-- Head Base -->
      <path d="M -70,35 C -75,-35 -50,-70 0,-70 C 50,-70 75,-35 70,35 C 65,65 -65,65 -70,35 Z" fill="#F8D5B8" class="stroke-bold"/>

      <!-- Hairline & Bald Top with Specular -->
      <path d="M -70,10 C -72,-45 -35,-65 -15,-65 C -8,-65 -8,-50 -18,-42 C -35,-35 -55,-18 -52,18 Z" fill="#13223A"/>
      <path d="M 70,10 C 72,-45 35,-65 15,-65 C 8,-65 8,-50 18,-42 C 35,-35 55,-18 52,18 Z" fill="#13223A"/>
      <ellipse cx="0" cy="-58" rx="16" ry="5" fill="#FFF1B8" opacity="0.6"/>

      <!-- Eyebrows (Skeptical) -->
      <path d="M -48,-20 Q -25,-38 -5,-20" fill="none" stroke="#13223A" stroke-width="6" stroke-linecap="round"/>
      <path d="M 10,-20 Q 30,-30 48,-16" fill="none" stroke="#13223A" stroke-width="6" stroke-linecap="round"/>

      <!-- Eyes (Looking right) -->
      <ellipse cx="-26" cy="-4" rx="12" ry="14" fill="#FFFFFF" class="stroke-medium"/>
      <circle cx="-20" cy="-4" r="6" fill="#13223A"/>
      <circle cx="-18" cy="-7" r="2" fill="#FFFFFF"/>

      <ellipse cx="26" cy="-4" rx="12" ry="14" fill="#FFFFFF" class="stroke-medium"/>
      <circle cx="32" cy="-4" r="6" fill="#13223A"/>
      <circle cx="34" cy="-7" r="2" fill="#FFFFFF"/>

      <!-- Mustache -->
      <path d="M -26,18 Q 0,22 26,18 Q 12,28 0,25 Q -12,28 -26,18 Z" fill="#13223A"/>

      <!-- Mouth -->
      <path d="M -18,28 Q 0,46 18,28 Z" fill="#820014" class="stroke-medium"/>
      <path d="M -14,29 Q 0,34 14,29" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    </g>

    <!-- Character Nameplate Badge -->
    <g transform="translate(80, 560)">
      <rect x="0" y="0" width="160" height="38" rx="10" fill="#101C31" stroke="#FA541C" stroke-width="2"/>
      <circle cx="18" cy="19" r="6" fill="#FA541C"/>
      <text x="36" y="26" fill="#FFFFFF" class="font-display" font-size="16">老王 · 经验派</text>
    </g>
  </g>

  <!-- Right Character: Xiao Ming (x=1600, w=300) -->
  <g id="char-xiaoming" transform="translate(1600, 270)">
    <!-- Shadow on floor -->
    <ellipse cx="140" cy="570" rx="100" ry="16" fill="#050A14" opacity="0.6"/>

    <!-- Slender Legs -->
    <path d="M 95,470 L 95,570 L 65,570" fill="none" stroke="#080E18" stroke-width="24" stroke-linecap="round"/>
    <path d="M 175,470 L 175,570 L 205,570" fill="none" stroke="#080E18" stroke-width="24" stroke-linecap="round"/>
    <rect x="55" y="558" width="50" height="18" rx="5" fill="#1FD6E2"/>
    <rect x="165" y="558" width="50" height="18" rx="5" fill="#1FD6E2"/>

    <!-- Torso: Asteroid Observatory Tech Coat -->
    <path d="M 70,240 C 60,300 70,480 95,480 L 180,480 C 205,480 215,300 205,240 Z" fill="#172A46" class="stroke-bold"/>
    <path d="M 110,240 L 138,320 L 165,240 Z" fill="#1FD6E2" opacity="0.3"/>

    <!-- Lanyard with ID OBS-01 -->
    <path d="M 120,240 L 138,350 L 155,240" fill="none" stroke="#1FD6E2" stroke-width="2.5"/>
    <rect x="125" y="350" width="26" height="36" rx="4" fill="#FFFFFF" class="stroke-fine"/>
    <rect x="129" y="355" width="18" height="10" fill="#1F5CFF"/>

    <!-- Left Arm holding Pointer towards Stage Diagram -->
    <path d="M 80,260 C 0,240 -40,210 -90,190" fill="none" stroke="#172A46" stroke-width="26" stroke-linecap="round"/>
    <path d="M 80,260 C 0,240 -40,210 -90,190" fill="none" class="stroke-bold"/>
    <rect x="-110" y="182" width="26" height="12" rx="3" fill="#1FD6E2" class="stroke-fine"/>
    <circle cx="-125" cy="188" r="5" fill="#1FD6E2" filter="url(#cyanGlow)"/>

    <!-- Right Arm (Relaxed) -->
    <path d="M 195,260 C 220,310 220,380 195,410" fill="none" stroke="#172A46" stroke-width="26" stroke-linecap="round"/>
    <circle cx="195" cy="415" r="14" fill="#F8D5B8" class="stroke-medium"/>

    <!-- Head & Face -->
    <g transform="translate(138, 140)">
      <!-- Neck -->
      <rect x="-16" y="60" width="32" height="40" rx="5" fill="#F8D5B8" class="stroke-medium"/>

      <!-- Head Base -->
      <ellipse cx="0" cy="0" rx="52" ry="62" fill="#F8D5B8" class="stroke-bold"/>

      <!-- Modern Neat Hair -->
      <path d="M -54,-8 C -56,-50 -25,-70 0,-70 C 30,-70 58,-48 54,-8 C 38,-38 0,-34 -54,-8 Z" fill="#101C31"/>

      <!-- Smart Glasses -->
      <g transform="translate(0, -4)">
        <rect x="-48" y="-15" width="40" height="30" rx="7" fill="#101C31" class="stroke-medium"/>
        <rect x="8" y="-15" width="40" height="30" rx="7" fill="#101C31" class="stroke-medium"/>
        <line x1="-8" y1="-1" x2="8" y2="-1" stroke="#101C31" stroke-width="3"/>

        <!-- Glowing Cyan Lenses -->
        <rect x="-44" y="-11" width="32" height="22" rx="4" fill="#1FD6E2" opacity="0.45"/>
        <rect x="12" y="-11" width="32" height="22" rx="4" fill="#1FD6E2" opacity="0.45"/>
        <line x1="-40" y1="-6" x2="-28" y2="-6" stroke="#FFFFFF" stroke-width="2"/>
        <line x1="16" y1="-6" x2="28" y2="-6" stroke="#FFFFFF" stroke-width="2"/>

        <!-- Eyes -->
        <circle cx="-28" cy="0" r="4.5" fill="#101C31"/>
        <circle cx="28" cy="0" r="4.5" fill="#101C31"/>
      </g>

      <!-- Smile -->
      <path d="M -14,36 Q 0,46 16,36" fill="none" stroke="#101C31" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Character Nameplate Badge -->
    <g transform="translate(50, 600)">
      <rect x="0" y="0" width="170" height="38" rx="10" fill="#101C31" stroke="#1FD6E2" stroke-width="2"/>
      <circle cx="18" cy="19" r="6" fill="#1FD6E2"/>
      <text x="36" y="26" fill="#FFFFFF" class="font-display" font-size="16">小明 · 观测研究员</text>
    </g>
  </g>

  <!-- Subtitle Bar at Bottom (Adaptive, Non-Occluding) -->
  <g transform="translate(180, 930)" filter="url(#panelShadow)">
    <rect x="0" y="0" width="1560" height="96" rx="20" fill="#080E18" stroke="#1F5CFF" stroke-width="2"/>

    <!-- Speaker Pill -->
    <g transform="translate(32, 24)">
      <rect x="0" y="0" width="100" height="48" rx="10" fill="#1FD6E2"/>
      <text x="50" y="32" fill="#080E18" class="font-display" font-size="22" text-anchor="middle">小明</text>
    </g>

    <!-- Dialogue Text with High Contrast -->
    <text x="160" y="58" fill="#FFFFFF" class="font-sans" font-size="26">
      “先别急，空调可不是水龙头。定频压缩机启动即按额定能力干活，温度调低并不会增加制冷功率。”
    </text>
  </g>
</svg>
