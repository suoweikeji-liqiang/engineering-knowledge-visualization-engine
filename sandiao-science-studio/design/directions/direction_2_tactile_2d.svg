<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .fine-stroke { stroke: #2B3A42; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .hairline { stroke: #4F6D7A; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .tactile-title { font-family: 'PingFang SC', 'Source Han Serif SC', 'Noto Serif SC', serif; font-weight: 700; }
      .tactile-body { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; font-weight: 500; }
    </style>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#EFEBE4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1D2A44" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Textured Background -->
  <rect width="1920" height="1080" fill="url(#warmBg)"/>

  <!-- Subtle Architectural Grid -->
  <line x1="120" y1="0" x2="120" y2="1080" stroke="#E2DDD5" stroke-width="1"/>
  <line x1="1800" y1="0" x2="1800" y2="1080" stroke="#E2DDD5" stroke-width="1"/>
  <line x1="0" y1="120" x2="1920" y2="120" stroke="#E2DDD5" stroke-width="1"/>
  <line x1="0" y1="920" x2="1920" y2="920" stroke="#E2DDD5" stroke-width="1"/>

  <!-- Minimalist Brand Header -->
  <g transform="translate(140, 60)">
    <circle cx="20" cy="20" r="8" fill="#E07A5F"/>
    <text x="40" y="26" fill="#2B3A42" class="tactile-title" font-size="22" letter-spacing="3">ASTEROID ENGINEERING VISUALS · 小行星工程绘本</text>
    <text x="1600" y="26" fill="#8D99AE" class="tactile-body" font-size="16" text-anchor="end">EPISODE 01 / THERMAL CONTROL</text>
  </g>

  <!-- Central Precision Infographic Card -->
  <g transform="translate(620, 160)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1120" height="660" rx="20" fill="url(#cardGrad)" stroke="#E5E0D8" stroke-width="1.5"/>

    <!-- Header Area -->
    <g transform="translate(50, 50)">
      <rect x="0" y="0" width="6" height="32" rx="3" fill="#E07A5F"/>
      <text x="24" y="26" fill="#1D3557" class="tactile-title" font-size="30">热力学误区：设定温度与制冷功率的非线性关系</text>
      <text x="24" y="60" fill="#6C757D" class="tactile-body" font-size="16">THERMODYNAMIC ANALYSIS / CONSTANT-SPEED COMPRESSOR</text>
    </g>

    <!-- Diagram Columns -->
    <!-- Column 1: Intuition vs Reality -->
    <g transform="translate(50, 140)">
      <rect x="0" y="0" width="480" height="440" rx="14" fill="#F8F9FA" stroke="#E9ECEF" stroke-width="1"/>
      <text x="30" y="45" fill="#495057" class="tactile-title" font-size="20">01 / 直觉模型（水龙头误区）</text>
      <path d="M60,160 C120,160 160,180 180,240 L180,300" fill="none" stroke="#C5D3E8" stroke-width="8" stroke-linecap="round"/>
      <circle cx="180" cy="340" r="14" fill="#839788"/>
      <text x="240" y="200" fill="#E07A5F" class="tactile-body" font-size="18">认为设定 16℃ = 开启超级大流量</text>
      <text x="240" y="235" fill="#6C757D" class="tactile-body" font-size="15">实际上蒸发器换热量存在物理上限</text>

      <!-- Stamped Stamp -->
      <g transform="translate(360, 360) rotate(-12)">
        <rect x="-60" y="-20" width="120" height="40" rx="6" fill="none" stroke="#E07A5F" stroke-width="2"/>
        <text x="0" y="6" fill="#E07A5F" class="tactile-title" font-size="16" text-anchor="middle">INVALID</text>
      </g>
    </g>

    <!-- Column 2: Compressor Power Curve -->
    <g transform="translate(570, 140)">
      <rect x="0" y="0" width="500" height="440" rx="14" fill="#F8F9FA" stroke="#E9ECEF" stroke-width="1"/>
      <text x="30" y="45" fill="#495057" class="tactile-title" font-size="20">02 / 定频压缩机工况曲线</text>

      <!-- Power Line Chart -->
      <line x1="60" y1="360" x2="440" y2="360" stroke="#ADB5BD" stroke-width="1.5"/>
      <line x1="60" y1="120" x2="60" y2="360" stroke="#ADB5BD" stroke-width="1.5"/>

      <!-- Rated Power Flat Line -->
      <line x1="60" y1="180" x2="440" y2="180" stroke="#1D3557" stroke-width="3"/>
      <circle cx="180" cy="180" r="5" fill="#E07A5F"/>
      <text x="180" y="160" fill="#1D3557" class="tactile-body" font-size="15" text-anchor="middle">额定输出 100% (恒定)</text>

      <!-- Time Extension Zone -->
      <rect x="260" y="180" width="160" height="180" fill="#E07A5F" opacity="0.1"/>
      <line x1="260" y1="180" x2="260" y2="360" stroke="#E07A5F" stroke-dasharray="4 4" stroke-width="1.5"/>
      <line x1="420" y1="180" x2="420" y2="360" stroke="#E07A5F" stroke-dasharray="4 4" stroke-width="1.5"/>
      <text x="340" y="270" fill="#E07A5F" class="tactile-body" font-size="16" text-anchor="middle">被迫持续满载</text>
      <text x="340" y="295" fill="#6C757D" class="tactile-body" font-size="14" text-anchor="middle">（增加无效耗电）</text>
    </g>
  </g>

  <!-- Left Character: Lao Wang (Refined editorial illustration) -->
  <g transform="translate(180, 420)">
    <!-- Shadow -->
    <ellipse cx="140" cy="540" rx="100" ry="16" fill="#1D2A44" opacity="0.08"/>

    <!-- Body & Clothes -->
    <path d="M 60,340 C 60,260 90,240 140,240 C 190,240 220,260 220,340 L 230,520 L 50,520 Z" fill="#4F5D75"/>
    <path d="M 90,240 L 140,320 L 190,240" fill="#E07A5F"/>

    <!-- Arm -->
    <path d="M 210,290 C 270,330 280,380 270,440" fill="none" stroke="#4F5D75" stroke-width="32" stroke-linecap="round"/>
    <circle cx="270" cy="450" r="18" fill="#F4A261"/>

    <!-- Head -->
    <ellipse cx="140" cy="150" rx="65" ry="75" fill="#F4A261"/>
    <path d="M 75,140 C 75,80 110,70 140,70 C 170,70 205,80 205,140 C 185,95 140,95 75,140 Z" fill="#2B3A42"/>
    <circle cx="115" cy="145" r="4" fill="#2B3A42"/>
    <circle cx="165" cy="145" r="4" fill="#2B3A42"/>
    <path d="M 125,185 C 135,190 145,190 155,185" fill="none" stroke="#2B3A42" stroke-width="2.5" stroke-linecap="round"/>

    <text x="140" y="580" fill="#4F5D75" class="tactile-body" font-size="18" text-anchor="middle">老王 / 机械维保顾问</text>
  </g>

  <!-- Right Character: Xiao Ming (Smart Academic) -->
  <g transform="translate(1560, 400)">
    <!-- Shadow -->
    <ellipse cx="120" cy="560" rx="90" ry="14" fill="#1D2A44" opacity="0.08"/>

    <!-- Body -->
    <path d="M 60,300 C 60,230 80,210 120,210 C 160,210 180,230 180,300 L 190,540 L 50,540 Z" fill="#1D3557"/>
    <rect x="95" y="210" width="50" height="80" fill="#F8F9FA"/>

    <!-- Head -->
    <ellipse cx="120" cy="130" rx="55" ry="65" fill="#F4A261"/>
    <path d="M 65,120 C 65,70 95,60 120,60 C 145,60 175,70 175,120 C 150,85 120,85 65,120 Z" fill="#1D3557"/>

    <!-- Refined Glasses -->
    <rect x="80" y="115" width="32" height="24" rx="4" fill="none" stroke="#2B3A42" stroke-width="1.5"/>
    <rect x="128" y="115" width="32" height="24" rx="4" fill="none" stroke="#2B3A42" stroke-width="1.5"/>
    <line x1="112" y1="127" x2="128" y2="127" stroke="#2B3A42" stroke-width="1.5"/>

    <!-- Pointing Gesture -->
    <path d="M 70,260 C -10,240 -30,220 -80,220" fill="none" stroke="#1D3557" stroke-width="26" stroke-linecap="round"/>
    <circle cx="-85" cy="220" r="14" fill="#F4A261"/>

    <text x="120" y="600" fill="#1D3557" class="tactile-body" font-size="18" text-anchor="middle">小明 / 观测站研究员</text>
  </g>

  <!-- Subtitle Area -->
  <g transform="translate(300, 950)">
    <rect x="0" y="0" width="1320" height="76" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1" filter="url(#softShadow)"/>
    <text x="660" y="46" fill="#2B3A42" class="tactile-body" font-size="24" text-anchor="middle">小明：“定频压缩机启动后输出功率是固定的，设 16℃ 只是让它更晚停机。”</text>
  </g>
</svg>
