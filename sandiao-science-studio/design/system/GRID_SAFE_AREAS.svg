<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .font-title { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-weight: 800; }
      .font-body { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-weight: 600; }
      .font-mono { font-family: 'SF Mono', 'Roboto Mono', monospace; font-weight: 600; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#0B1321"/>

  <!-- Left: 16:9 Landscape Layout Breakdown -->
  <g transform="translate(60, 60)">
    <text x="0" y="30" fill="#FFFFFF" class="font-title" font-size="26">16:9 横屏标准安全区与分栏结构 (1920 × 1080)</text>

    <g transform="translate(0, 60)">
      <!-- 16:9 Canvas mini representation: 1000 x 562.5 -->
      <rect x="0" y="0" width="1000" height="562" rx="16" fill="#101C31" stroke="#1F5CFF" stroke-width="2"/>

      <!-- Action Safe (80px in full -> 42px in mini) -->
      <rect x="42" y="25" width="916" height="512" rx="10" fill="none" stroke="#1FD6E2" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="50" y="45" fill="#1FD6E2" class="font-mono" font-size="12">Action Safe (1760×984)</text>

      <!-- Layout Zones -->
      <!-- Left Character Zone (w=160px in mini) -->
      <rect x="50" y="100" width="160" height="360" rx="8" fill="#FA541C" opacity="0.15" stroke="#FA541C" stroke-width="1.5"/>
      <text x="130" y="280" fill="#FA541C" class="font-body" font-size="14" text-anchor="middle">左角色互动区</text>
      <text x="130" y="305" fill="#FA541C" class="font-mono" font-size="12" text-anchor="middle">w: 320px</text>

      <!-- Central Diagram Stage (w=580px in mini) -->
      <rect x="230" y="80" width="540" height="380" rx="12" fill="#FFFFFF" opacity="0.9" stroke="#13223A" stroke-width="2"/>
      <text x="500" y="260" fill="#13223A" class="font-title" font-size="18" text-anchor="middle">中央科技图解主舞台</text>
      <text x="500" y="290" fill="#6B7A99" class="font-mono" font-size="14" text-anchor="middle">1160 × 690 px (8px Grid Container)</text>

      <!-- Right Character Zone (w=160px in mini) -->
      <rect x="790" y="100" width="160" height="360" rx="8" fill="#1FD6E2" opacity="0.15" stroke="#1FD6E2" stroke-width="1.5"/>
      <text x="870" y="280" fill="#1FD6E2" class="font-body" font-size="14" text-anchor="middle">右角色互动区</text>
      <text x="870" y="305" fill="#1FD6E2" class="font-mono" font-size="12" text-anchor="middle">w: 320px</text>

      <!-- Top Nav Bar -->
      <rect x="50" y="35" width="900" height="35" rx="6" fill="#1F5CFF" opacity="0.3"/>
      <text x="500" y="58" fill="#FFFFFF" class="font-body" font-size="12" text-anchor="middle">顶部品牌导航与课题栏 (y: 36~96)</text>

      <!-- Bottom Subtitle Bar -->
      <rect x="50" y="480" width="900" height="50" rx="8" fill="#080E18" stroke="#1F5CFF" stroke-width="1.5"/>
      <text x="500" y="510" fill="#FFFFFF" class="font-body" font-size="13" text-anchor="middle">底部无遮挡字幕条 (y: 920~1030, 对比度 > 15:1)</text>
    </g>

    <!-- Key Rules for 16:9 -->
    <g transform="translate(0, 660)">
      <rect x="0" y="0" width="1000" height="240" rx="14" fill="#101C31" stroke="#1F5CFF" stroke-width="1"/>
      <text x="30" y="40" fill="#1FD6E2" class="font-title" font-size="18">16:9 核心布局规则：</text>
      <text x="30" y="75" fill="#FFFFFF" class="font-body" font-size="15">1. 左右角色锚定在屏幕两侧 320px 专属通道，不侵入中央 1160px 图解大白板；</text>
      <text x="30" y="110" fill="#FFFFFF" class="font-body" font-size="15">2. 流程图节点数量限制为 3-4 个，各占 250px 宽度，节点间距 40px，绝对杜绝右侧溢出；</text>
      <text x="30" y="145" fill="#FFFFFF" class="font-body" font-size="15">3. 标题置于大白板顶部专属 Tab 胶囊中，与下方图例保持至少 24px 净间距；</text>
      <text x="30" y="180" fill="#FFFFFF" class="font-body" font-size="15">4. 底部字幕采用深色底板，与上方角色脚部保持 20px 缓冲，杜绝遮挡腰带与手势。</text>
    </g>
  </g>

  <!-- Right: 9:16 Vertical Layout Breakdown -->
  <g transform="translate(1120, 60)">
    <text x="0" y="30" fill="#FFFFFF" class="font-title" font-size="26">9:16 竖屏自适应重排与交互避让 (1080 × 1920)</text>

    <g transform="translate(40, 60)">
      <!-- 9:16 Mini Representation: 420 x 746.6 -->
      <rect x="0" y="0" width="420" height="746" rx="16" fill="#101C31" stroke="#1F5CFF" stroke-width="2"/>

      <!-- Top Status Area (y: 0~180 -> mini 0~70) -->
      <rect x="20" y="20" width="380" height="60" rx="8" fill="#1F5CFF" opacity="0.3"/>
      <text x="210" y="55" fill="#FFFFFF" class="font-body" font-size="13" text-anchor="middle">顶部标题与观察课题 (避让系统栏)</text>

      <!-- Stage 1: Dual Character Dialogue Area (mini y: 90~230) -->
      <rect x="20" y="90" width="380" height="150" rx="10" fill="#FA541C" opacity="0.15" stroke="#FA541C" stroke-width="1"/>
      <text x="210" y="170" fill="#FA541C" class="font-body" font-size="14" text-anchor="middle">上段：双角色半身对话舞台 (y: 200~580)</text>

      <!-- Stage 2: Vertical Stacked Diagram Area (mini y: 250~580) -->
      <rect x="20" y="250" width="380" height="340" rx="12" fill="#FFFFFF" opacity="0.95" stroke="#13223A" stroke-width="2"/>
      <text x="210" y="410" fill="#13223A" class="font-title" font-size="16" text-anchor="middle">中段：纵向自适应图解大卡片</text>
      <text x="210" y="440" fill="#6B7A99" class="font-mono" font-size="12" text-anchor="middle">860 × 920 px (纵向堆叠模式)</text>

      <!-- Right Interaction Buttons Clearance Zone (Douyin/Bilibili Likes, Comments) -->
      <rect x="330" y="270" width="70" height="260" rx="8" fill="#F04B2F" opacity="0.3" stroke="#F04B2F" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="365" y="400" fill="#FFA39E" class="font-mono" font-size="11" text-anchor="middle" transform="rotate(-90 365 400)">UI 避让区</text>

      <!-- Stage 3: High-Contrast Subtitle Area (mini y: 600~660) -->
      <rect x="20" y="600" width="380" height="60" rx="8" fill="#080E18" stroke="#1F5CFF" stroke-width="1.5"/>
      <text x="210" y="635" fill="#FFFFFF" class="font-body" font-size="13" text-anchor="middle">下段：大号加粗字幕 (y: 1560~1720)</text>

      <!-- Bottom System Home Bar Clearance (mini y: 670~730) -->
      <rect x="20" y="670" width="380" height="60" rx="6" fill="#000000" opacity="0.5"/>
      <text x="210" y="705" fill="#8FA6CB" class="font-mono" font-size="11" text-anchor="middle">手机底栏避让区 (y: 1720~1920)</text>
    </g>

    <!-- Key Rules for 9:16 -->
    <g transform="translate(0, 830)">
      <rect x="0" y="0" width="740" height="70" rx="10" fill="#101C31" stroke="#1FD6E2" stroke-width="1"/>
      <text x="20" y="42" fill="#1FD6E2" class="font-body" font-size="14">✔ 9:16 采用纵向三段式流式重排，图卡右侧留出 120px 杜绝点赞遮挡。</text>
    </g>
  </g>
</svg>
