<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .font-title { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-weight: 800; }
      .font-body { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-weight: 600; }
      .font-mono { font-family: 'SF Mono', 'Roboto Mono', monospace; font-weight: 600; }
      .border { stroke: #13223A; stroke-width: 2; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1321"/>
      <stop offset="100%" stop-color="#14233C"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Header -->
  <g transform="translate(100, 60)">
    <text x="0" y="40" fill="#FFFFFF" class="font-title" font-size="36">小行星原理剧场 · 品牌色彩系统 (Brand Color Palette)</text>
    <text x="0" y="75" fill="#8FA6CB" class="font-body" font-size="20">ASTEROID PRINCIPLE THEATER / WCAG AAA COMPLIANT COLOR SPECIFICATION</text>
  </g>

  <!-- Color Swatches Grid -->
  <!-- Row 1: Core Brand Colors -->
  <g transform="translate(100, 180)">
    <!-- Swatch 1: Observatory Night -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="320" height="220" rx="16" fill="#101C31" stroke="#1FD6E2" stroke-width="1.5"/>
      <rect x="0" y="0" width="320" height="110" rx="16" fill="#101C31"/>
      <text x="20" y="145" fill="#FFFFFF" class="font-title" font-size="20">Observatory Night</text>
      <text x="20" y="175" fill="#1FD6E2" class="font-mono" font-size="16">HEX: #101C31</text>
      <text x="20" y="200" fill="#8FA6CB" class="font-body" font-size="14">深空背景 / 主框架 / 暗调转场</text>
    </g>

    <!-- Swatch 2: Orbit Blue -->
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="320" height="220" rx="16" fill="#FFFFFF" class="border"/>
      <rect x="0" y="0" width="320" height="110" rx="16" fill="#1F5CFF"/>
      <text x="20" y="145" fill="#13223A" class="font-title" font-size="20">Orbit Blue</text>
      <text x="20" y="175" fill="#1F5CFF" class="font-mono" font-size="16">HEX: #1F5CFF</text>
      <text x="20" y="200" fill="#6B7A99" class="font-body" font-size="14">星轨主线 / 交互高亮 / 品牌主徽章</text>
    </g>

    <!-- Swatch 3: Telemetry Cyan -->
    <g transform="translate(700, 0)">
      <rect x="0" y="0" width="320" height="220" rx="16" fill="#FFFFFF" class="border"/>
      <rect x="0" y="0" width="320" height="110" rx="16" fill="#1FD6E2"/>
      <text x="20" y="145" fill="#13223A" class="font-title" font-size="20">Telemetry Cyan</text>
      <text x="20" y="175" fill="#006D75" class="font-mono" font-size="16">HEX: #1FD6E2</text>
      <text x="20" y="200" fill="#6B7A99" class="font-body" font-size="14">遥测数据流 / 冷量流向 / 验证通过</text>
    </g>

    <!-- Swatch 4: Signal Orange -->
    <g transform="translate(1050, 0)">
      <rect x="0" y="0" width="320" height="220" rx="16" fill="#FFFFFF" class="border"/>
      <rect x="0" y="0" width="320" height="110" rx="16" fill="#FA541C"/>
      <text x="20" y="145" fill="#13223A" class="font-title" font-size="20">Signal Orange</text>
      <text x="20" y="175" fill="#D4380D" class="font-mono" font-size="16">HEX: #FA541C</text>
      <text x="20" y="200" fill="#6B7A99" class="font-body" font-size="14">老王主工装 / 误区警告 / 高温排热</text>
    </g>

    <!-- Swatch 5: Observation Paper -->
    <g transform="translate(1400, 0)">
      <rect x="0" y="0" width="320" height="220" rx="16" fill="#FFFFFF" class="border"/>
      <rect x="0" y="0" width="320" height="110" rx="16" fill="#F4F6F9" stroke="#D9D9D9" stroke-width="1"/>
      <text x="20" y="145" fill="#13223A" class="font-title" font-size="20">Observation Paper</text>
      <text x="20" y="175" fill="#595959" class="font-mono" font-size="16">HEX: #F4F6F9 / #FFFFFF</text>
      <text x="20" y="200" fill="#6B7A99" class="font-body" font-size="14">图解主舞台 / 白板卡片 / 360p 极速辨识</text>
    </g>
  </g>

  <!-- Row 2: Functional Semantic States -->
  <g transform="translate(100, 460)">
    <text x="0" y="0" fill="#FFFFFF" class="font-title" font-size="24">功能语义与状态颜色规范 (Semantic State Colors)</text>

    <g transform="translate(0, 30)">
      <!-- Card 1: Verified / Physics Fact -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="410" height="240" rx="16" fill="#E6FFFB" stroke="#13C2C2" stroke-width="2.5"/>
        <circle cx="40" cy="40" r="16" fill="#13C2C2"/>
        <text x="40" y="46" fill="#FFFFFF" class="font-title" font-size="18" text-anchor="middle">✓</text>
        <text x="70" y="47" fill="#00474F" class="font-title" font-size="22">验证通过 / 物理定律 (Fact)</text>
        <line x1="20" y1="80" x2="390" y2="80" stroke="#87E8DE" stroke-width="1"/>
        <text x="24" y="115" fill="#006D75" class="font-body" font-size="16">背景: #E6FFFB | 边框: #13C2C2 | 文本: #00474F</text>
        <text x="24" y="145" fill="#00474F" class="font-body" font-size="14">用于小明经过科学验证确认的结论、正确能效习惯与定频额定出力事实。</text>
      </g>

      <!-- Card 2: Myth / Rejection -->
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="410" height="240" rx="16" fill="#FFF1F0" stroke="#F04B2F" stroke-width="2.5"/>
        <circle cx="40" cy="40" r="16" fill="#F04B2F"/>
        <text x="40" y="46" fill="#FFFFFF" class="font-title" font-size="18" text-anchor="middle">✕</text>
        <text x="70" y="47" fill="#820014" class="font-title" font-size="22">直觉误区 / 错误否定 (Myth)</text>
        <line x1="20" y1="80" x2="390" y2="80" stroke="#FFA39E" stroke-width="1"/>
        <text x="24" y="115" fill="#A8071A" class="font-body" font-size="16">背景: #FFF1F0 | 边框: #F04B2F | 文本: #820014</text>
        <text x="24" y="145" fill="#820014" class="font-body" font-size="14">用于老王提出的生活直觉经验陷阱（如“16℃水龙头论”），打上红色驳斥印章。</text>
      </g>

      <!-- Card 3: Warning / Energy Surge -->
      <g transform="translate(880, 0)">
        <rect x="0" y="0" width="410" height="240" rx="16" fill="#FFFBE6" stroke="#FAAD14" stroke-width="2.5"/>
        <circle cx="40" cy="40" r="16" fill="#FAAD14"/>
        <text x="40" y="46" fill="#FFFFFF" class="font-title" font-size="18" text-anchor="middle">!</text>
        <text x="70" y="47" fill="#874D00" class="font-title" font-size="22">警示 / 耗电激增 (Alert)</text>
        <line x1="20" y1="80" x2="390" y2="80" stroke="#FFE58F" stroke-width="1"/>
        <text x="24" y="115" fill="#D46B08" class="font-body" font-size="16">背景: #FFFBE6 | 边框: #FAAD14 | 文本: #874D00</text>
        <text x="24" y="145" fill="#874D00" class="font-body" font-size="14">用于压缩机持续无休满载、电费翻倍以及房间永远无法达到的无效功耗预警。</text>
      </g>

      <!-- Card 4: Dark Subtitle Bar Spec -->
      <g transform="translate(1320, 0)">
        <rect x="0" y="0" width="400" height="240" rx="16" fill="#080E18" stroke="#1F5CFF" stroke-width="2.5"/>
        <rect x="24" y="24" width="90" height="32" rx="8" fill="#1FD6E2"/>
        <text x="69" y="46" fill="#080E18" class="font-title" font-size="16" text-anchor="middle">小明</text>
        <text x="130" y="48" fill="#FFFFFF" class="font-title" font-size="20">字幕条规范</text>
        <line x1="20" y1="80" x2="380" y2="80" stroke="#1F5CFF" stroke-width="1"/>
        <text x="24" y="115" fill="#1FD6E2" class="font-mono" font-size="15">极夜黑 #080E18 + 纯白文字</text>
        <text x="24" y="145" fill="#8FA6CB" class="font-body" font-size="14">对比度高达 18.2:1，彻底避免与背景图解冲突，确保任何画面下 100% 易读。</text>
      </g>
    </g>
  </g>

  <!-- Bottom Contrast Matrix -->
  <g transform="translate(100, 780)">
    <rect x="0" y="0" width="1720" height="220" rx="20" fill="#101C31" stroke="#1F5CFF" stroke-width="1.5"/>
    <text x="40" y="50" fill="#FFFFFF" class="font-title" font-size="22">色彩无障碍与对比度认证 (Accessibility &amp; Contrast Verification)</text>
    <text x="40" y="85" fill="#8FA6CB" class="font-body" font-size="15">所有关键文字与背景的对比度均远超 WCAG AAA 级（7:1）标准：</text>

    <g transform="translate(40, 115)">
      <rect x="0" y="0" width="380" height="70" rx="10" fill="#FFFFFF"/>
      <text x="20" y="42" fill="#13223A" class="font-title" font-size="18">Charcoal Ink on Paper</text>
      <text x="350" y="42" fill="#006D75" class="font-mono" font-size="18" text-anchor="end">15.8 : 1 (AAA ✓)</text>
    </g>

    <g transform="translate(450, 115)">
      <rect x="0" y="0" width="380" height="70" rx="10" fill="#080E18" stroke="#1FD6E2" stroke-width="1"/>
      <text x="20" y="42" fill="#FFFFFF" class="font-title" font-size="18">White on Deep Void</text>
      <text x="350" y="42" fill="#1FD6E2" class="font-mono" font-size="18" text-anchor="end">18.2 : 1 (AAA ✓)</text>
    </g>

    <g transform="translate(860, 115)">
      <rect x="0" y="0" width="380" height="70" rx="10" fill="#101C31" stroke="#FA541C" stroke-width="1"/>
      <text x="20" y="42" fill="#1FD6E2" class="font-title" font-size="18">Cyan on Observatory</text>
      <text x="350" y="42" fill="#1FD6E2" class="font-mono" font-size="18" text-anchor="end">9.2 : 1 (AAA ✓)</text>
    </g>

    <g transform="translate(1270, 115)">
      <rect x="0" y="0" width="410" height="70" rx="10" fill="#FFF1F0" stroke="#F04B2F" stroke-width="1"/>
      <text x="20" y="42" fill="#820014" class="font-title" font-size="18">Red on Myth Card</text>
      <text x="380" y="42" fill="#A8071A" class="font-mono" font-size="18" text-anchor="end">8.5 : 1 (AAA ✓)</text>
    </g>
  </g>
</svg>
