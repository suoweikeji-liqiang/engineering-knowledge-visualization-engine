      <path id="face" d="M 186,245 C 180,165 205,130 256,130 C 307,130 332,165 326,245 C 321,278 191,278 186,245 Z" fill="#F8D5B8" stroke="#13223A" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- Hairline & Characteristic Bald Top with Specular -->
      <path id="hair" d="M 186,215 C 184,155 220,135 240,135 C 248,135 248,150 238,158 C 220,165 200,185 204,225 Z" fill="#13223A"/>
      <path d="M 326,215 C 328,155 292,135 272,135 C 264,135 264,150 274,158 C 292,165 312,185 308,225 Z" fill="#13223A"/>
      <ellipse cx="256" cy="144" rx="18" ry="6" fill="#FFF1B8" opacity="0.6"/>

      <!-- Eyebrows -->
      <path id="brow_left" d="M 200,195 Q 220,180 240,195" fill="none" stroke="#13223A" stroke-width="5" stroke-linecap="round"/>
      <path id="brow_right" d="M 272,195 Q 292,180 312,195" fill="none" stroke="#13223A" stroke-width="5" stroke-linecap="round"/>

      <!-- Eyes -->
      <g id="eye_left">
        <ellipse cx="220" cy="210" rx="13" ry="15" fill="#FFFFFF" stroke="#13223A" stroke-width="2.5"/>
        <circle cx="220" cy="210" r="6.5" fill="#13223A"/>
        <circle cx="222" cy="208" r="2" fill="#FFFFFF"/>
      </g>
      <g id="eye_right">
        <ellipse cx="292" cy="210" rx="13" ry="15" fill="#FFFFFF" stroke="#13223A" stroke-width="2.5"/>
        <circle cx="292" cy="210" r="6.5" fill="#13223A"/>
        <circle cx="294" cy="208" r="2" fill="#FFFFFF"/>
      </g>

      <!-- Mustache -->
      <path id="mustache" d="M 230,238 Q 256,242 282,238 Q 268,248 256,245 Q 244,248 230,238 Z" fill="#13223A"/>

      <!-- Mouth Component -->
      <path id="mouth" d="M 236,260 Q 256,275 276,260" fill="none" stroke="#13223A" stroke-width="4" stroke-linecap="round"/>

      <!-- Emotion Extras -->

    </g>

    <g id="prop_anchor" transform="translate(256, 495)"/>
  </g>
</g>
    <g id="xm_v_point">
