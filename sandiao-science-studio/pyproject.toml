[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandiao-science-studio"
version = "0.1.0"
description = "JSON-driven Chinese cartoon explainer video starter."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["Pillow>=10", "numpy>=1.26", "requests>=2.31", "CairoSVG>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sandiao = "sandiao_studio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
